name: Dependabot Auto Approve and Merge

on:
  pull_request:
    types: [labeled, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Dependabot attaches every label in its own `labeled` event, so only the
    # `automerge` label event (plus later pushes/reopens) starts this job.
    if: >-
      github.actor == 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      (github.event.action != 'labeled' || github.event.label.name == 'automerge')
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Check pull request state
        id: pr_state
        run: |
          read -r STATE AUTO_MERGE < <(gh pr view "$PR_NUMBER" --json state,autoMergeRequest \
            --jq '"\(.state) \(.autoMergeRequest != null)"')
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "auto_merge=$AUTO_MERGE" >> "$GITHUB_OUTPUT"
          echo "PR #$PR_NUMBER state: $STATE, auto-merge enabled: $AUTO_MERGE"

      - name: Auto approve PR
        if: steps.pr_state.outputs.state == 'OPEN'
        run: |
          gh pr review "$PR_NUMBER" --approve --body "✅ Auto approved Dependabot dependency update"

      - name: Enable auto-merge with squash
        if: steps.pr_state.outputs.state == 'OPEN' && steps.pr_state.outputs.auto_merge == 'false'
        run: |
          gh pr merge "$PR_NUMBER" --squash --auto
          echo "🚀 Enabled auto-merge (Squash and merge)"
