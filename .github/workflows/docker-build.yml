name: Build and Publish Image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      image: ${{ steps.identity.outputs.image }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      release: ${{ steps.identity.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.1'
      - name: Identify candidate without touching release tags
        id: identity
        run: |
          version=$(node -p "require('./package.json').version")
          release=$(node -p "require('./release.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          revision=${release#"$version-custom."}
          [[ "$release" == "$version-custom.$revision" && "$revision" =~ ^[1-9][0-9]*$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=candidate-${version}-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - name: Generate fixture configuration and typecheck
        env:
          UPTIME_KUMA_BASE_URL: http://127.0.0.1:43161
          PAGE_ID: default,cert,ipc
          FEATURE_TITLE: Uptime.Tips
          FEATURE_ICON: /icon.svg
          FEATURE_EDIT_THIS_PAGE: 'false'
          FEATURE_SHOW_STAR_BUTTON: 'false'
        run: |
          node scripts/ci/mock-kuma.mjs > "$RUNNER_TEMP/mock-kuma.log" 2>&1 &
          mock_pid=$!
          trap 'kill "$mock_pid"' EXIT
          bun run generate
          bunx --no-install tsc --noEmit

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.validate.outputs.image }}
      TAG: ${{ needs.validate.outputs.tag }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@v3
      - name: Build production image on its native architecture
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=Uptime.Tips Kuma Mieru
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.licenses=MPL-2.0
          cache-from: type=gha,scope=candidate-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=candidate-${{ matrix.arch }}
      - name: Smoke test the built image with legacy production settings
        run: |
          node scripts/ci/mock-kuma.mjs > "$RUNNER_TEMP/mock-kuma.log" 2>&1 &
          mock_pid=$!
          trap 'docker logs candidate; docker rm -f candidate; kill "$mock_pid"' EXIT
          docker run -d --name candidate --network host \
            -e HOSTNAME=127.0.0.1 -e PORT=43176 \
            -e UPTIME_KUMA_BASE_URL=http://127.0.0.1:43161 \
            -e PAGE_ID=default,cert,ipc \
            -e FEATURE_TITLE=Uptime.Tips -e FEATURE_ICON=/icon.svg \
            -e FEATURE_EDIT_THIS_PAGE=false -e FEATURE_SHOW_STAR_BUTTON=false \
            -e USE_IMAGE_PROXY=true -e TIMEZONE=UTC \
            "$IMAGE:$TAG-$ARCH"
          node scripts/ci/smoke-image.mjs > "$RUNNER_TEMP/smoke-$ARCH.json"
          cat "$RUNNER_TEMP/smoke-$ARCH.json"
      - name: Log in to GHCR only after tests pass
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested architecture image
        run: |
          docker push "$IMAGE:$TAG-$ARCH"
          mkdir -p "$RUNNER_TEMP/digests"
          docker image inspect "$IMAGE:$TAG-$ARCH" --format '{{index .RepoDigests 0}}' > "$RUNNER_TEMP/digests/$ARCH.txt"
          grep -Eq '^ghcr.io/.+@sha256:[a-f0-9]{64}$' "$RUNNER_TEMP/digests/$ARCH.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/smoke-*.json
            ${{ runner.temp }}/mock-kuma.log

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ${{ needs.validate.outputs.image }}
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
      RELEASE: ${{ needs.validate.outputs.release }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Assemble tested images without rebuilding
        run: |
          test -s digests/amd64.txt
          test -s digests/arm64.txt
          mapfile -t images < <(cat digests/amd64.txt digests/arm64.txt)
          docker buildx imagetools create --tag "$IMAGE:$TAG" "${images[@]}"
          docker buildx imagetools inspect "$IMAGE:$TAG" | tee candidate-manifest.txt
          digest=$(awk '$1 == "Digest:" { print $2; exit }' candidate-manifest.txt)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          {
            echo '### Verified candidate image'
            echo "Source commit: $GITHUB_SHA"
            echo "Image tag: $IMAGE:$TAG"
            echo "Pinned image: $IMAGE@$digest"
            echo 'linux/amd64 and linux/arm64 both passed container smoke tests.'
            echo 'Both architectures passed native runtime checks; no production deployment was performed.'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$IMAGE@$digest" > candidate-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: verified-candidate
          path: |
            candidate-image.txt
            candidate-manifest.txt
      - name: Publish release aliases from the verified manifest
        if: github.ref == 'refs/heads/main'
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$current_main" = "$GITHUB_SHA"
          pinned=$(cat candidate-image.txt)
          digest=${pinned#*@}
          # An immutable custom version must never point to another build.
          if docker buildx imagetools inspect "$IMAGE:$RELEASE" > existing.txt 2> existing-error.txt; then
            existing=$(awk '$1 == "Digest:" { print $2; exit }' existing.txt)
            if [ "$existing" != "$digest" ]; then
              echo 'Release version already exists. Increment release.json before publishing.' >&2
              exit 1
            fi
          elif ! grep -Eqi 'not found|manifest unknown|404' existing-error.txt; then
            cat existing-error.txt >&2
            exit 1
          fi
          docker buildx imagetools create --prefer-index=true \
            --tag "$IMAGE:$RELEASE" \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:${VERSION%.*}" \
            --tag "$IMAGE:${VERSION%%.*}" \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:sha-${GITHUB_SHA:0:12}" "$pinned"
          for tag in "$RELEASE" "$VERSION" "${VERSION%.*}" "${VERSION%%.*}" latest "sha-${GITHUB_SHA:0:12}"; do
            actual=$(docker buildx imagetools inspect "$IMAGE:$tag" | awk '$1 == "Digest:" { print $2; exit }')
            test "$actual" = "$digest"
          done
          {
            echo "Upstream version: $VERSION"
            echo "Custom version: $RELEASE"
            echo "Source commit: $GITHUB_SHA"
            echo "Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Image: $IMAGE:$VERSION"
            echo "Pinned image: $pinned"
            echo 'Platforms: linux/amd64, linux/arm64 (selected automatically).'
            echo 'Validation: lint, unit tests, typecheck, production builds and native container smoke checks.'
            echo 'Production deployment is separate from this release.'
          } > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
          if ! gh release view "custom/v$RELEASE" >/dev/null 2>&1; then
            gh release create "custom/v$RELEASE" --target "$GITHUB_SHA" \
              --title "$RELEASE" --notes-file release-notes.md --latest
          fi
